# =============================================================================
# DART-ESIR — autologin de l'utilisateur rt sur tty1 au boot
# =============================================================================
# Drop-in pour `getty@tty1.service`. Permet de démarrer le kiosque dès le
# boot du Pi sans intervention manuelle.
#
# Pourquoi pas systemd --user direct ? Parce que cage (compositor Wayland)
# a besoin du seat0 — un accès direct au DRM/HDMI/clavier que systemd-logind
# ne donne qu'à une SESSION active sur un tty. Un service --user lancé via
# linger ne crée pas de session sur seat0 → cage refuse de démarrer.
# Solution classique kiosque : autologin tty1 → la session est active dès
# le boot → cage est lancé par .bash_profile et obtient le seat naturellement.
#
# Installation :
#   sudo mkdir -p /etc/systemd/system/getty@tty1.service.d/
#   sudo cp webui/systemd/getty-autologin.conf \
#       /etc/systemd/system/getty@tty1.service.d/override.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart getty@tty1.service   # ou reboot
#
# Désactivation (revenir au login manuel) :
#   sudo rm /etc/systemd/system/getty@tty1.service.d/override.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart getty@tty1.service
# =============================================================================

[Service]
# `ExecStart=` (ligne vide) reset la commande par défaut héritée du template
# getty@.service. Sinon les deux ExecStart se cumuleraient.
ExecStart=
ExecStart=-/sbin/agetty --autologin rt --noclear %I $TERM
Type=simple
